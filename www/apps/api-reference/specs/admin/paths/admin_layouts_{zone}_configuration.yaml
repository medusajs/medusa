get:
  operationId: GetLayoutsZoneConfiguration
  summary: List Configurations
  description: >-
    Retrieve a list of configurations in a layout. The configurations can be
    filtered by fields like FILTER FIELDS. The configurations can also be
    paginated.
  x-authenticated: true
  parameters:
    - name: zone
      in: path
      description: The layout's zone.
      required: true
      schema:
        type: string
  security:
    - api_token: []
    - cookie_auth: []
    - jwt_token: []
  x-codeSamples:
    - lang: Shell
      label: cURL
      source:
        $ref: ../code_samples/Shell/admin_layouts_{zone}_configuration/get.sh
  tags:
    - Layouts
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AdminLayoutConfigurationResponse.yaml
    '400':
      $ref: ../components/responses/400_error.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '409':
      $ref: ../components/responses/invalid_state_error.yaml
    '422':
      $ref: ../components/responses/invalid_request_error.yaml
    '500':
      $ref: ../components/responses/500_error.yaml
