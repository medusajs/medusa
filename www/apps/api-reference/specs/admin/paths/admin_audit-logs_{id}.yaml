get:
  operationId: GetAuditLogsId
  summary: Get a Audit Log
  description: >-
    Retrieve a audit log by its ID. You can expand the audit log's relations or
    select the fields that should be returned.
  x-authenticated: true
  parameters:
    - name: id
      in: path
      description: The audit log's ID.
      required: true
      schema:
        type: string
  security:
    - api_token: []
    - cookie_auth: []
    - jwt_token: []
  x-codeSamples:
    - lang: JavaScript
      label: JS SDK
      source:
        $ref: ../code_samples/JavaScript/admin_audit-logs_{id}/get.js
    - lang: Shell
      label: cURL
      source:
        $ref: ../code_samples/Shell/admin_audit-logs_{id}/get.sh
  tags:
    - Audit Logs
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AdminAuditLogResponse.yaml
    '400':
      $ref: ../components/responses/400_error.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '409':
      $ref: ../components/responses/invalid_state_error.yaml
    '422':
      $ref: ../components/responses/invalid_request_error.yaml
    '500':
      $ref: ../components/responses/500_error.yaml
  x-allowed:
    - id
    - started_at
    - ended_at
    - actor_type
    - actor_id
    - impersonator_id
    - action
    - resource_type
    - resource_id
    - outcome
    - request
    - request_data
    - response_data
    - metadata
