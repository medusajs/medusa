post:
  operationId: PostAuth_providerUser
  summary: Create an Admin User for an Auth Provider
  x-sidebar-summary: Create Admin User
  description: >-
    Create an admin user for an auth provider. This is useful for providers like
    OIDC where the user is created in the provider and then needs to be created
    in Medusa. Be careful of using this endpoint with providers like Google or
    GitHub, as any one can sign up as an admin user. Make sure to disable these
    providers for admin users using the
    [http.authMethodsPerActor](https://docs.medusajs.com/resources/commerce-modules/auth/auth-providers#configure-allowed-auth-providers-of-actor-types)
    configuration.
  x-authenticated: false
  parameters:
    - name: auth_provider
      in: path
      description: The ID of the auth provider to create the admin user for.
      required: true
      schema:
        type: string
  x-codeSamples:
    - lang: JavaScript
      label: JS SDK
      source:
        $ref: ../code_samples/JavaScript/auth_{auth_provider}_user/post.js
    - lang: Shell
      label: cURL
      source:
        $ref: ../code_samples/Shell/auth_{auth_provider}_user/post.sh
  tags:
    - '[auth_provider]'
  responses:
    '200':
      description: OK
    '400':
      $ref: ../components/responses/400_error.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '409':
      $ref: ../components/responses/invalid_state_error.yaml
    '422':
      $ref: ../components/responses/invalid_request_error.yaml
    '500':
      $ref: ../components/responses/500_error.yaml
  x-workflow: createUserAccountWorkflow
  x-events:
    - name: user.created
      payload: |-
        ```ts
        {
          id, // The ID of the user
        }
        ```
      description: Emitted when users are created.
      deprecated: false
