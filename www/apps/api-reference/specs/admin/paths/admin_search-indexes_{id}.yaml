delete:
  operationId: DeleteSearchIndexesId
  summary: Delete a Search Index
  description: >-
    Delete a search index and every physical index built for it in the search
    engine. The index's definition isn't removed, so the next time search index
    migrations run, the index is built again from scratch at version 1.
  externalDocs:
    description: Learn about reindexing and index migrations
    url: >-
      https://docs.medusajs.com/resources/infrastructure-modules/search/reindexing
  x-authenticated: true
  parameters:
    - name: id
      in: path
      description: The search index's name, such as `product`.
      required: true
      schema:
        type: string
  security:
    - api_token: []
    - cookie_auth: []
    - jwt_token: []
  x-codeSamples:
    - lang: JavaScript
      label: JS SDK
      source:
        $ref: ../code_samples/JavaScript/admin_search-indexes_{id}/delete.js
    - lang: Shell
      label: cURL
      source:
        $ref: ../code_samples/Shell/admin_search-indexes_{id}/delete.sh
  tags:
    - Search Indexes
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AdminSearchIndexDeleteResponse.yaml
    '400':
      $ref: ../components/responses/400_error.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '409':
      $ref: ../components/responses/invalid_state_error.yaml
    '422':
      $ref: ../components/responses/invalid_request_error.yaml
    '500':
      $ref: ../components/responses/500_error.yaml
  x-workflow: deleteSearchIndexWorkflow
  x-events: []
