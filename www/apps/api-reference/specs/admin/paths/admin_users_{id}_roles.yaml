get:
  operationId: GetUsersIdRoles
  summary: List User's Roles
  description: >-
    Retrieve a list of roles assigned to a user, including the scope of each
    assignment. The roles can be paginated.
  x-authenticated: true
  parameters:
    - name: id
      in: path
      description: The user's ID.
      required: true
      schema:
        type: string
    - name: role_id
      in: query
      required: false
      schema:
        oneOf:
          - type: string
            title: role_id
            description: The user's role id.
          - type: array
            description: The user's role id.
            items:
              type: string
              title: role_id
              description: The role id's details.
    - name: scope
      in: query
      required: false
      schema:
        oneOf:
          - type: string
            title: scope
            description: The user's scope.
          - type: array
            description: The user's scope.
            items:
              type: string
              title: scope
              description: The scope's details.
    - name: scope_id
      in: query
      required: false
      schema:
        oneOf:
          - type: string
            title: scope_id
            description: The user's scope id.
          - type: array
            description: The user's scope id.
            items:
              type: string
              title: scope_id
              description: The scope id's details.
    - name: limit
      in: query
      description: Limit the number of items returned in the list.
      required: false
      schema:
        type: number
        title: limit
        description: Limit the number of items returned in the list.
        externalDocs:
          url: '#pagination'
    - name: offset
      in: query
      description: The number of items to skip when retrieving a list.
      required: false
      schema:
        type: number
        title: offset
        description: The number of items to skip when retrieving a list.
        externalDocs:
          url: '#pagination'
    - name: order
      in: query
      description: >-
        The field to sort the data by. By default, the sort order is ascending.
        To change the order to descending, prefix the field name with `-`.
      required: false
      schema:
        type: string
        title: order
        description: >-
          The field to sort the data by. By default, the sort order is
          ascending. To change the order to descending, prefix the field name
          with `-`.
        externalDocs:
          url: '#pagination'
    - name: with_deleted
      in: query
      description: The user's with deleted.
      required: false
      schema:
        type: boolean
        title: with_deleted
        description: The user's with deleted.
    - name: fields
      in: query
      description: >-
        Comma-separated fields that should be included in the returned data. If
        a field is prefixed with `+` it will be added to the default fields,
        using `-` will remove it from the default fields. Without prefix it will
        replace the entire default fields.
      required: false
      schema:
        type: string
        title: fields
        description: >-
          Comma-separated fields that should be included in the returned data.
          If a field is prefixed with `+` it will be added to the default
          fields, using `-` will remove it from the default fields. Without
          prefix it will replace the entire default fields.
        externalDocs:
          url: '#select-fields-and-relations'
    - name: $and
      in: query
      description: >-
        Join query parameters with an AND condition. Each object's content is
        the same type as the expected query parameters.
      required: false
      schema:
        type: array
        description: >-
          Join query parameters with an AND condition. Each object's content is
          the same type as the expected query parameters.
        items:
          type: object
        title: $and
    - name: $or
      in: query
      description: >-
        Join query parameters with an OR condition. Each object's content is the
        same type as the expected query parameters.
      required: false
      schema:
        type: array
        description: >-
          Join query parameters with an OR condition. Each object's content is
          the same type as the expected query parameters.
        items:
          type: object
        title: $or
  security:
    - cookie_auth: []
    - jwt_token: []
  x-codeSamples:
    - lang: JavaScript
      label: JS SDK
      source:
        $ref: ../code_samples/JavaScript/admin_users_{id}_roles/get.js
    - lang: Shell
      label: cURL
      source:
        $ref: ../code_samples/Shell/admin_users_{id}_roles/get.sh
  tags:
    - Users
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AdminUserRoleListResponse.yaml
    '400':
      $ref: ../components/responses/400_error.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '409':
      $ref: ../components/responses/invalid_state_error.yaml
    '422':
      $ref: ../components/responses/invalid_request_error.yaml
    '500':
      $ref: ../components/responses/500_error.yaml
post:
  operationId: PostUsersIdRoles
  summary: Add Roles to User
  description: >-
    Assign one or more roles to a user, optionally constrained to a scope. You
    can only assign roles whose policies you have.
  x-authenticated: true
  parameters:
    - name: id
      in: path
      description: The user's ID.
      required: true
      schema:
        type: string
  security:
    - cookie_auth: []
    - jwt_token: []
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/AdminAssignUserRoles.yaml
  x-codeSamples:
    - lang: JavaScript
      label: JS SDK
      source:
        $ref: ../code_samples/JavaScript/admin_users_{id}_roles/post.js
    - lang: Shell
      label: cURL
      source:
        $ref: ../code_samples/Shell/admin_users_{id}_roles/post.sh
  tags:
    - Users
  responses:
    '200':
      description: OK
    '400':
      $ref: ../components/responses/400_error.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '409':
      $ref: ../components/responses/invalid_state_error.yaml
    '422':
      $ref: ../components/responses/invalid_request_error.yaml
    '500':
      $ref: ../components/responses/500_error.yaml
  x-workflow: assignRolesWorkflow
  x-events: []
