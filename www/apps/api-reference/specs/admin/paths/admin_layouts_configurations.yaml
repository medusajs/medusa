get:
  operationId: GetLayoutsConfigurations
  summary: List Layouts
  description: >-
    Retrieve a list of layouts. The layouts can be filtered by fields such as
    `id`. The layouts can also be sorted or paginated.
  x-authenticated: true
  parameters:
    - name: id
      in: query
      required: false
      schema:
        oneOf:
          - type: string
            title: id
            description: The layout's ID.
          - type: array
            description: The layout's ID.
            items:
              type: string
              title: id
              description: The id's ID.
    - name: zone
      in: query
      required: false
      schema:
        oneOf:
          - type: string
            title: zone
            description: The layout's zone.
          - type: array
            description: The layout's zone.
            items:
              type: string
              title: zone
              description: The zone's details.
    - name: user_id
      in: query
      required: false
      schema:
        oneOf:
          - type: string
            title: user_id
            description: The layout's user id.
          - type: array
            description: The layout's user id.
            items:
              type: string
              title: user_id
              description: The user id's details.
    - name: is_system_default
      in: query
      description: The layout's is system default.
      required: false
      schema:
        type: boolean
        title: is_system_default
        description: The layout's is system default.
    - name: limit
      in: query
      description: Limit the number of items returned in the list.
      required: false
      schema:
        type: number
        title: limit
        description: Limit the number of items returned in the list.
        externalDocs:
          url: '#pagination'
    - name: offset
      in: query
      description: The number of items to skip when retrieving a list.
      required: false
      schema:
        type: number
        title: offset
        description: The number of items to skip when retrieving a list.
        externalDocs:
          url: '#pagination'
    - name: order
      in: query
      description: >-
        The field to sort the data by. By default, the sort order is ascending.
        To change the order to descending, prefix the field name with `-`.
      required: false
      schema:
        type: string
        title: order
        description: >-
          The field to sort the data by. By default, the sort order is
          ascending. To change the order to descending, prefix the field name
          with `-`.
        externalDocs:
          url: '#pagination'
    - name: with_deleted
      in: query
      description: The layout's with deleted.
      required: false
      schema:
        type: boolean
        title: with_deleted
        description: The layout's with deleted.
    - name: fields
      in: query
      description: >-
        Comma-separated fields that should be included in the returned data. If
        a field is prefixed with `+` it will be added to the default fields,
        using `-` will remove it from the default fields. Without prefix it will
        replace the entire default fields.
      required: false
      schema:
        type: string
        title: fields
        description: >-
          Comma-separated fields that should be included in the returned data.
          If a field is prefixed with `+` it will be added to the default
          fields, using `-` will remove it from the default fields. Without
          prefix it will replace the entire default fields.
        externalDocs:
          url: '#select-fields-and-relations'
    - name: $and
      in: query
      description: >-
        Join query parameters with an AND condition. Each object's content is
        the same type as the expected query parameters.
      required: false
      schema:
        type: array
        description: >-
          Join query parameters with an AND condition. Each object's content is
          the same type as the expected query parameters.
        items:
          type: object
        title: $and
    - name: $or
      in: query
      description: >-
        Join query parameters with an OR condition. Each object's content is the
        same type as the expected query parameters.
      required: false
      schema:
        type: array
        description: >-
          Join query parameters with an OR condition. Each object's content is
          the same type as the expected query parameters.
        items:
          type: object
        title: $or
  security:
    - api_token: []
    - cookie_auth: []
    - jwt_token: []
  x-codeSamples:
    - lang: Shell
      label: cURL
      source:
        $ref: ../code_samples/Shell/admin_layouts_configurations/get.sh
  tags:
    - Layouts
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - type: object
                description: SUMMARY
                required:
                  - limit
                  - offset
                  - count
                properties:
                  limit:
                    type: number
                    title: limit
                    description: The layout's limit.
                  offset:
                    type: number
                    title: offset
                    description: The layout's offset.
                  count:
                    type: number
                    title: count
                    description: The layout's count.
                  estimate_count:
                    type: number
                    title: estimate_count
                    description: The layout's estimate count.
                    x-featureFlag: index_engine
              - type: object
                description: SUMMARY
                required:
                  - layout_configurations
                properties:
                  layout_configurations:
                    type: array
                    description: The layout's layout configurations.
                    items:
                      $ref: ../components/schemas/AdminLayoutConfiguration.yaml
    '400':
      $ref: ../components/responses/400_error.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '409':
      $ref: ../components/responses/invalid_state_error.yaml
    '422':
      $ref: ../components/responses/invalid_request_error.yaml
    '500':
      $ref: ../components/responses/500_error.yaml
