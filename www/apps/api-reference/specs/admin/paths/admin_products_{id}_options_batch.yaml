  summary: Add Options to Product
  description: Add a list of options to a product.
  x-authenticated: true
  parameters:
    - name: id
      in: path
      description: The product's ID.
      required: true
      schema:
        type: string
  security:
    - api_token: []
    - cookie_auth: []
    - jwt_token: []
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/AdminLinkProductOptions.yaml
  x-codeSamples:
    - lang: JavaScript
      label: JS SDK
