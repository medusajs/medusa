get:
  operationId: GetSearchIndexes
  summary: List Search Indexes
  description: >-
    Retrieve the list of search indexes registered in your application,
    including each index's provider, lifecycle status, and the fields it stores.
    If the Search Module isn't installed in your application, `enabled` is
    `false` and `search_indexes` is an empty array.
  externalDocs:
    description: Learn about the Search Module
    url: https://docs.medusajs.com/resources/infrastructure-modules/search
  x-authenticated: true
  security:
    - api_token: []
    - cookie_auth: []
    - jwt_token: []
  x-codeSamples:
    - lang: JavaScript
      label: JS SDK
      source:
        $ref: ../code_samples/JavaScript/admin_search-indexes/get.js
    - lang: Shell
      label: cURL
      source:
        $ref: ../code_samples/Shell/admin_search-indexes/get.sh
  tags:
    - Search Indexes
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AdminSearchIndexListResponse.yaml
    '400':
      $ref: ../components/responses/400_error.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '409':
      $ref: ../components/responses/invalid_state_error.yaml
    '422':
      $ref: ../components/responses/invalid_request_error.yaml
    '500':
      $ref: ../components/responses/500_error.yaml
