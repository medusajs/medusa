delete:
  operationId: DeleteUsersIdRolesRole_id
  summary: Remove Role from User
  description: >-
    Unassign a role from a user. Pass `scope` and `scope_id` in the request body
    to remove the role's assignment in that scope.
  x-authenticated: true
  parameters:
    - name: id
      in: path
      description: The user's ID.
      required: true
      schema:
        type: string
    - name: role_id
      in: path
      description: The user's role id.
      required: true
      schema:
        type: string
  security:
    - cookie_auth: []
    - jwt_token: []
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/AdminUnassignUserRole.yaml
  x-codeSamples:
    - lang: JavaScript
      label: JS SDK
      source:
        $ref: ../code_samples/JavaScript/admin_users_{id}_roles_{role_id}/delete.js
    - lang: Shell
      label: cURL
      source:
        $ref: ../code_samples/Shell/admin_users_{id}_roles_{role_id}/delete.sh
  tags:
    - Users
  responses:
    '200':
      description: OK
    '400':
      $ref: ../components/responses/400_error.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '409':
      $ref: ../components/responses/invalid_state_error.yaml
    '422':
      $ref: ../components/responses/invalid_request_error.yaml
    '500':
      $ref: ../components/responses/500_error.yaml
  x-workflow: unassignRolesWorkflow
  x-events: []
  x-since: 2.22.3
