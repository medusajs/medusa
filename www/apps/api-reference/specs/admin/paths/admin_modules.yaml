get:
  operationId: GetModules
  summary: List Modules
  description: >-
    Retrieve the modules installed in the Medusa application. You can use this
    API route to check whether a module, such as the RBAC Module, is installed.
  x-authenticated: true
  security:
    - api_token: []
    - cookie_auth: []
    - jwt_token: []
  x-codeSamples:
    - lang: JavaScript
      label: JS SDK
      source:
        $ref: ../code_samples/JavaScript/admin_modules/get.js
    - lang: Shell
      label: cURL
      source:
        $ref: ../code_samples/Shell/admin_modules/get.sh
  tags:
    - Modules
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AdminModulesListResponse.yaml
    '400':
      $ref: ../components/responses/400_error.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '409':
      $ref: ../components/responses/invalid_state_error.yaml
    '422':
      $ref: ../components/responses/invalid_request_error.yaml
    '500':
      $ref: ../components/responses/500_error.yaml
