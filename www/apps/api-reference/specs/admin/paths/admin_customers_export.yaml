post:
  operationId: PostCustomersExport
  summary: Export Customers
  description: >
    Start a customer export process to retrieve a file of exported customers.
    Use the query parameters to filter the exported customers and select the
    fields to include.


    You'll receive in the response the transaction ID of the workflow generating
    the file. To check the status of the execution, send a GET request to
    `/admin/workflows-executions/export-customers/:transaction-id`.


    Once the execution finishes successfully, a notification is created for the
    export. You can retrieve the notifications using the `/admin/notification`
    API route to retrieve the file's download URL.
  x-authenticated: true
  parameters:
    - name: groups
      in: query
      required: false
      schema:
        oneOf:
          - type: string
            title: groups
            description: >-
              Filter by a customer group's ID to retrieve customers that belong
              to it.
          - $ref: ../components/schemas/CustomerGroupInCustomerFilters.yaml
          - type: array
            description: >-
              Filter by customer group IDs to retrieve customers that belong to
              them.
            items:
              type: string
              title: groups
              description: The customer group's ID.
    - name: has_account
      in: query
      description: Filter by whether the customer is registered.
      required: false
      schema:
        type: boolean
        title: has_account
        description: Filter by whether the customer is registered.
    - name: q
      in: query
      description: Search term to filter the customer's searchable properties by.
      required: false
      schema:
        type: string
        title: q
        description: Search term to filter the customer's searchable properties by.
    - name: id
      in: query
      required: false
      schema:
        oneOf:
          - type: string
            title: id
            description: Filter by a customer's ID.
          - type: array
            description: Filter by customer IDs.
            items:
              type: string
              title: id
              description: A customer's ID.
          - type: object
            properties:
              $and:
                type: array
                description: >-
                  Join query parameters with an AND condition. Each object's
                  content is the same type as the expected query parameters.
                items:
                  type: object
              $or:
                type: array
                description: >-
                  Join query parameters with an OR condition. Each object's
                  content is the same type as the expected query parameters.
                items:
                  type: object
              $eq:
                oneOf:
                  - type: string
                    title: $eq
                    description: Filter by exact value.
                  - type: array
                    title: $eq
                    description: Filter by exact value.
                    items:
                      type: string
              $ne:
                type: string
                title: $ne
                description: Filter by not equal to the given value.
              $in:
                type: array
                title: $in
                description: Filter by values included in the given array.
                items:
                  type: string
              $nin:
                type: array
                title: $nin
                description: Filter by values not included in the given array.
                items:
                  type: string
              $not:
                oneOf:
                  - type: string
                    title: $not
                    description: Filter by not equal to the given value.
                  - type: object
                    title: $not
                    description: >-
                      Filter by values not matching the conditions in this
                      parameter.
                  - type: array
                    title: $not
                    description: >-
                      Filter by values not matching the conditions in this
                      parameter.
                    items:
                      type: string
              $gt:
                type: string
                title: $gt
                description: Filter by values greater than the given value.
              $gte:
                type: string
                title: $gte
                description: Filter by values greater than or equal to the given value.
              $lt:
                type: string
                title: $lt
                description: Filter by values less than the given value.
              $lte:
                type: string
                title: $lte
                description: Filter by values less than or equal to the given value.
              $like:
                type: string
                title: $like
                description: Apply a `like` filter. Useful for strings only.
              $re:
                type: string
                title: $re
                description: Apply a regex filter. Useful for strings only.
              $ilike:
                type: string
                title: $ilike
                description: >-
                  Apply a case-insensitive `like` filter. Useful for strings
                  only.
              $fulltext:
                type: string
                title: $fulltext
                description: Filter to apply on full-text properties.
              $overlap:
                type: array
                title: $overlap
                description: >-
                  Filter to apply on array properties to find overlapping
                  values.
                items:
                  type: string
              $contains:
                type: array
                title: $contains
                description: Filter to apply on array properties to find contained values.
                items:
                  type: string
              $contained:
                type: array
                title: $contained
                description: Filter to apply on array properties to find contained values.
                items:
                  type: string
              $exists:
                type: boolean
                title: $exists
                description: Filter by whether a value exists or not.
            title: id
            description: Filter by conditions on the customer's ID.
