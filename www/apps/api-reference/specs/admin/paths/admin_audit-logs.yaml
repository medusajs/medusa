get:
  operationId: GetAuditLogs
  summary: List Audit Logs
  description: >-
    Retrieve a list of audit logs, newest first. The audit logs can be filtered
    by fields such as `actor_id`, `resource_type`, or `outcome`. The audit logs
    can also be sorted or paginated. This API route is only available when the
    Audit Module is installed.
  externalDocs:
    url: https://docs.medusajs.com/resources/enterprise/audit
    description: Learn more about the Audit Module.
  x-authenticated: true
  parameters:
    - name: id
      in: query
      required: false
      schema:
        oneOf:
          - type: string
            title: id
            description: Filter by an audit log ID.
          - type: array
            description: Filter by audit log IDs.
            items:
              type: string
              title: id
              description: An audit log ID.
    - name: actor_type
      in: query
      required: false
      schema:
        oneOf:
          - type: string
            title: actor_type
            description: Filter by an actor type, such as `user`, `api-key`, or `system`.
          - type: array
            description: Filter by actor types.
            items:
              type: string
              title: actor_type
              description: An actor type.
    - name: actor_id
      in: query
      required: false
      schema:
        oneOf:
          - type: string
            title: actor_id
            description: >-
              Filter by the ID of the user, API key, or customer that performed
              the action.
          - type: array
            description: Filter by actor IDs.
            items:
              type: string
              title: actor_id
              description: An actor ID.
    - name: action
      in: query
      required: false
      schema:
        oneOf:
          - type: string
            title: action
            description: Filter by an action, such as `order.cancel`.
          - type: array
            description: Filter by actions.
            items:
              type: string
              title: action
              description: An action.
    - name: resource_type
      in: query
      required: false
      schema:
        oneOf:
          - type: string
            title: resource_type
            description: Filter by the type of resource acted on, such as `order`.
          - type: array
            description: Filter by resource types.
            items:
              type: string
              title: resource_type
              description: A resource type.
    - name: resource_id
      in: query
      required: false
      schema:
        oneOf:
          - type: string
            title: resource_id
            description: Filter by the ID of the resource acted on.
          - type: array
            description: Filter by resource IDs.
            items:
              type: string
              title: resource_id
              description: A resource ID.
    - name: outcome
      in: query
      required: false
      schema:
        oneOf:
          - type: string
            title: outcome
            description: >-
              Filter by how the action ended. `denied` is a `401` or `403`
              response, and `failed` is any other error response.
            enum:
              - succeeded
              - denied
              - failed
          - type: array
            description: Filter by outcomes.
            items:
              type: string
              description: An outcome.
              enum:
                - succeeded
                - denied
                - failed
    - name: q
      in: query
      description: >-
        A search term to search the audit logs' action, resource type, resource
        ID, and actor ID.
      required: false
      schema:
        type: string
        title: q
        description: >-
          A search term to search the audit logs' action, resource type,
          resource ID, and actor ID.
    - name: limit
      in: query
      description: Limit the number of items returned in the list.
      required: false
      schema:
        type: number
        title: limit
        description: Limit the number of items returned in the list.
        externalDocs:
          url: '#pagination'
    - name: offset
      in: query
      description: The number of items to skip when retrieving a list.
      required: false
      schema:
        type: number
        title: offset
        description: The number of items to skip when retrieving a list.
        externalDocs:
          url: '#pagination'
    - name: order
      in: query
      description: >-
        The field to sort the audit logs by. Audit logs can only be sorted by
        `started_at`, and they're sorted by `-started_at` by default.
      required: false
      schema:
        type: string
        title: order
        description: >-
          The field to sort the audit logs by. Audit logs can only be sorted by
          `started_at`, and they're sorted by `-started_at` by default.
        externalDocs:
          url: '#pagination'
    - name: started_at
      in: query
      description: Filter by when the action started, with dates as ISO 8601 strings.
      required: false
      schema:
        type: object
        description: Filter by when the action started, with dates as ISO 8601 strings.
        x-schemaName: AdminAuditLogDateRange
        properties:
          $gt:
            type: string
            title: $gt
            description: >-
              Filter by values greater than this parameter. Useful for numbers
              and dates only.
          $gte:
            type: string
            title: $gte
            description: >-
              Filter by values greater than or equal to this parameter. Useful
              for numbers and dates only.
          $lt:
            type: string
            title: $lt
            description: >-
              Filter by values less than this parameter. Useful for numbers and
              dates only.
          $lte:
            type: string
            title: $lte
            description: >-
              Filter by values less than or equal to this parameter. Useful for
              numbers and dates only.
    - name: fields
      in: query
      description: >-
        Comma-separated fields that should be included in the returned data. If
        a field is prefixed with `+` it will be added to the default fields,
        using `-` will remove it from the default fields. Without prefix it will
        replace the entire default fields.
      required: false
      schema:
        type: string
        title: fields
        description: >-
          Comma-separated fields that should be included in the returned data.
          If a field is prefixed with `+` it will be added to the default
          fields, using `-` will remove it from the default fields. Without
          prefix it will replace the entire default fields.
        externalDocs:
          url: '#select-fields-and-relations'
  security:
    - api_token: []
    - cookie_auth: []
    - jwt_token: []
  x-codeSamples:
    - lang: JavaScript
      label: JS SDK
      source:
        $ref: ../code_samples/JavaScript/admin_audit-logs/get.js
    - lang: Shell
      label: cURL
      source:
        $ref: ../code_samples/Shell/admin_audit-logs/get.sh
  tags:
    - Audit Logs
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - type: object
                description: The paginated list of audit logs.
                required:
                  - limit
                  - offset
                  - count
                properties:
                  limit:
                    type: number
                    title: limit
                    description: The maximum number of items retrieved.
                  offset:
                    type: number
                    title: offset
                    description: >-
                      The number of items to skip before retrieving the returned
                      items.
                  count:
                    type: number
                    title: count
                    description: The total number of items.
                  estimate_count:
                    type: number
                    title: estimate_count
                    description: >-
                      The estimated count retrieved from the PostgreSQL query
                      planner, which may be inaccurate.
                    deprecated: true
                    x-featureFlag: index_engine
              - type: object
                description: The paginated list of audit logs.
                required:
                  - audit_logs
                properties:
                  audit_logs:
                    type: array
                    description: The list of audit logs.
                    items:
                      $ref: ../components/schemas/AdminAuditLog.yaml
    '400':
      $ref: ../components/responses/400_error.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '409':
      $ref: ../components/responses/invalid_state_error.yaml
    '422':
      $ref: ../components/responses/invalid_request_error.yaml
    '500':
      $ref: ../components/responses/500_error.yaml
  x-allowed:
    - id
    - started_at
    - ended_at
    - actor_type
    - actor_id
    - impersonator_id
    - action
    - resource_type
    - resource_id
    - outcome
    - request
    - request_data
    - response_data
    - metadata
  x-since: 2.23.0
