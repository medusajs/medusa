post:
  operationId: PostExchangesIdCancel
  summary: Cancel an Exchange
  description: Cancel an exchange and its associated return.
  x-authenticated: true
  parameters:
    - name: id
      in: path
      description: The exchange's ID.
      required: true
      schema:
        type: string
  security:
    - api_token: []
    - cookie_auth: []
    - jwt_token: []
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/AdminPostCancelExchangeReqSchema.yaml
  x-codeSamples:
    - lang: JavaScript
      label: JS SDK
      source:
        $ref: ../code_samples/JavaScript/admin_exchanges_{id}_cancel/post.js
    - lang: Shell
      label: cURL
      source:
        $ref: ../code_samples/Shell/admin_exchanges_{id}_cancel/post.sh
  tags:
    - Exchanges
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AdminExchangeResponse.yaml
    '400':
      $ref: ../components/responses/400_error.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '409':
      $ref: ../components/responses/invalid_state_error.yaml
    '422':
      $ref: ../components/responses/invalid_request_error.yaml
    '500':
      $ref: ../components/responses/500_error.yaml
  x-workflow: cancelOrderExchangeWorkflow
  x-events:
    - name: reservation-item.deleted
      payload: |-
        ```ts
        {
          id, // The ID of the reservation
          order_id, // (optional) The ID of the order, if the reservation was deleted by an order flow
        }
        ```
      description: Emitted when reservations are deleted.
      deprecated: false
      since: 2.18.0
