post:
  operationId: PostUsersIdResetPassword
  summary: Add Reset Password to User
  description: Add a Reset Password to a user
  x-authenticated: true
  parameters:
    - name: id
      in: path
      description: The user's ID.
      required: true
      schema:
        type: string
  security:
    - cookie_auth: []
    - jwt_token: []
  x-codeSamples:
    - lang: JavaScript
      label: JS SDK
      source:
        $ref: ../code_samples/JavaScript/admin_users_{id}_reset-password/post.js
    - lang: Shell
      label: cURL
      source:
        $ref: ../code_samples/Shell/admin_users_{id}_reset-password/post.sh
  tags:
    - Users
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AdminUserResetPasswordTokenResponse.yaml
    '400':
      $ref: ../components/responses/400_error.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '409':
      $ref: ../components/responses/invalid_state_error.yaml
    '422':
      $ref: ../components/responses/invalid_request_error.yaml
    '500':
      $ref: ../components/responses/500_error.yaml
  x-workflow: generateResetPasswordTokenWorkflow
  x-events:
    - name: auth.password_reset
      payload: |-
        ```ts
        {
          entity_id, // The identifier of the user or customer. For example, an email address.
          actor_type, // The type of actor. For example, "customer", "user", or custom.
          token, // The generated token.
          metadata, // Optional custom metadata passed from the request.
        }
        ```
      description: >-
        Emitted when a reset password token is generated. You can listen to this
        event

        to send a reset password email to the user or customer, for example.
      deprecated: false
  x-since: 2.19.1
