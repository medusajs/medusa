type: object
description: >-
  A date range filter. Dates can be passed as `Date` objects or ISO 8601
  strings.
x-schemaName: AuditLogDateRange
properties:
  $gt:
    type: string
    title: $gt
    description: >-
      Filter by values greater than this parameter. Useful for numbers and dates
      only.
    format: date-time
  $gte:
    type: string
    title: $gte
    description: >-
      Filter by values greater than or equal to this parameter. Useful for
      numbers and dates only.
    format: date-time
  $lt:
    type: string
    title: $lt
    description: >-
      Filter by values less than this parameter. Useful for numbers and dates
      only.
    format: date-time
  $lte:
    type: string
    title: $lte
    description: >-
      Filter by values less than or equal to this parameter. Useful for numbers
      and dates only.
    format: date-time
