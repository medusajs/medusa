get:
  operationId: GetProductsSearch
  summary: List Products
  description: >-
    Retrieve a list of products. The products can be filtered by fields such as
    `id`. The products can also be sorted or paginated.
  x-authenticated: false
  parameters:
    - name: x-publishable-api-key
      in: header
      description: Publishable API Key created in the Medusa Admin.
      required: true
      schema:
        type: string
        externalDocs:
          url: https://docs.medusajs.com/api/store/publishable-api-key
    - name: x-medusa-locale
      in: header
      description: The locale in BCP 47 format to retrieve localized content.
      required: false
      schema:
        type: string
        example: en-US
        externalDocs:
          url: >-
            https://docs.medusajs.com/resources/commerce-modules/translation/storefront
          description: Learn more in the Serve Translations in Storefront guide.
    - name: locale
      in: query
      description: The locale in BCP 47 format to retrieve localized content.
      required: false
      schema:
        type: string
        example: en-US
        externalDocs:
          url: >-
            https://docs.medusajs.com/resources/commerce-modules/translation/storefront
          description: Learn more in the Serve Translations in Storefront guide.
    - name: offset
      in: query
      description: The number of items to skip when retrieving a list.
      required: false
      schema:
        type: number
        title: offset
        description: The number of items to skip when retrieving a list.
        externalDocs:
          url: '#pagination'
    - name: limit
      in: query
      description: Limit the number of items returned in the list.
      required: false
      schema:
        type: number
        title: limit
        description: Limit the number of items returned in the list.
        externalDocs:
          url: '#pagination'
    - name: order
      in: query
      description: >-
        The field to sort the data by. By default, the sort order is ascending.
        To change the order to descending, prefix the field name with `-`.
      required: false
      schema:
        type: string
        title: order
        description: >-
          The field to sort the data by. By default, the sort order is
          ascending. To change the order to descending, prefix the field name
          with `-`.
        externalDocs:
          url: '#pagination'
    - name: fields
      in: query
      description: >-
        Comma-separated fields that should be included in the returned data. If
        a field is prefixed with `+` it will be added to the default fields,
        using `-` will remove it from the default fields. Without prefix it will
        replace the entire default fields.
      required: false
      schema:
        type: string
        title: fields
        description: >-
          Comma-separated fields that should be included in the returned data.
          If a field is prefixed with `+` it will be added to the default
          fields, using `-` will remove it from the default fields. Without
          prefix it will replace the entire default fields.
        externalDocs:
          url: '#select-fields-and-relations'
    - name: with_deleted
      in: query
      description: The product's with deleted.
      required: false
      schema:
        type: boolean
        title: with_deleted
        description: The product's with deleted.
    - name: q
      in: query
      description: The product's q.
      required: false
      schema:
        type: string
        title: q
        description: The product's q.
    - name: id
      in: query
      required: false
      schema:
        oneOf:
          - type: string
            title: id
            description: The product's ID.
          - type: array
            description: The product's ID.
            items:
              type: string
              title: id
              description: The id's ID.
    - name: handle
      in: query
      required: false
      schema:
        oneOf:
          - type: string
            title: handle
            description: The product's handle.
          - type: array
            description: The product's handle.
            items:
              type: string
              title: handle
              description: The handle's details.
    - name: collection_id
      in: query
      required: false
      schema:
        oneOf:
          - type: string
            title: collection_id
            description: The product's collection id.
          - type: array
            description: The product's collection id.
            items:
              type: string
              title: collection_id
              description: The collection id's details.
    - name: type_id
      in: query
      required: false
      schema:
        oneOf:
          - type: string
            title: type_id
            description: The product's type id.
          - type: array
            description: The product's type id.
            items:
              type: string
              title: type_id
              description: The type id's details.
    - name: tag_id
      in: query
      required: false
      schema:
        oneOf:
          - type: string
            title: tag_id
            description: The product's tag id.
          - type: array
            description: The product's tag id.
            items:
              type: string
              title: tag_id
              description: The tag id's details.
    - name: category_id
      in: query
      required: false
      schema:
        oneOf:
          - type: string
            title: category_id
            description: The product's category id.
          - type: array
            description: The product's category id.
            items:
              type: string
              title: category_id
              description: The category id's details.
    - name: sales_channel_id
      in: query
      required: false
      schema:
        oneOf:
          - type: string
            title: sales_channel_id
            description: The product's sales channel id.
          - type: array
            description: The product's sales channel id.
            items:
              type: string
              title: sales_channel_id
              description: The sales channel id's details.
    - name: region_id
      in: query
      description: The product's region id.
      required: false
      schema:
        type: string
        title: region_id
        description: The product's region id.
    - name: country_code
      in: query
      description: The product's country code.
      required: false
      schema:
        type: string
        title: country_code
        description: The product's country code.
    - name: province
      in: query
      description: The product's province.
      required: false
      schema:
        type: string
        title: province
        description: The product's province.
    - name: cart_id
      in: query
      description: The product's cart id.
      required: false
      schema:
        type: string
        title: cart_id
        description: The product's cart id.
  x-codeSamples:
    - lang: Shell
      label: cURL
      source:
        $ref: ../code_samples/Shell/store_products_search/get.sh
  tags:
    - Products
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            allOf:
              - type: object
                description: SUMMARY
                required:
                  - limit
                  - offset
                  - count
                properties:
                  limit:
                    type: number
                    title: limit
                    description: The maximum number of items retrieved.
                  offset:
                    type: number
                    title: offset
                    description: >-
                      The number of items to skip before retrieving the returned
                      items.
                  count:
                    type: number
                    title: count
                    description: The total number of items.
                  estimate_count:
                    type: number
                    title: estimate_count
                    description: The product's estimate count.
                    x-featureFlag: index_engine
              - type: object
                description: SUMMARY
                required:
                  - products
                properties:
                  products:
                    type: array
                    description: The list of products.
                    items:
                      type: object
    '400':
      $ref: ../components/responses/400_error.yaml
    '401':
      $ref: ../components/responses/unauthorized.yaml
    '404':
      $ref: ../components/responses/not_found_error.yaml
    '409':
      $ref: ../components/responses/invalid_state_error.yaml
    '422':
      $ref: ../components/responses/invalid_request_error.yaml
    '500':
      $ref: ../components/responses/500_error.yaml
  x-allowed:
    - id
    - title
    - subtitle
    - description
    - handle
    - status
    - collection_id
    - type_id
    - created_at
    - updated_at
    - is_giftcard
    - discountable
    - thumbnail
    - weight
    - length
    - height
    - width
    - hs_code
    - origin_country
    - mid_code
    - material
    - type
    - collection
    - options
    - options.values
    - tags
    - images
    - variants
    - variants.options
    - metadata
    - categories
    - external_id
