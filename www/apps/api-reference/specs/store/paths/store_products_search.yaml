    - variants.options.value
    - options.id
    - options.title
    - options.is_exclusive
    - options.values.id
    - options.values.value
    - images.id
    - images.url
    - images.rank
    - type.id
    - type.value
    - type.created_at
    - type.updated_at
    - tags.id
