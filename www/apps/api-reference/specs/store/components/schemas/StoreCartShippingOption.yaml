type: object
description: The shipping option's shipping options.
x-schemaName: StoreCartShippingOption
required:
  - id
  - name
  - price_type
  - service_zone_id
  - shipping_profile_id
  - provider_id
  - data
  - type
  - provider
  - amount
  - prices
  - calculated_price
  - insufficient_inventory
properties:
  id:
    type: string
    title: id
    description: The shipping option's ID.
  name:
    type: string
    title: name
    description: The shipping option's name.
  price_type:
    type: string
    description: The shipping option's price type.
    enum:
      - calculated
      - flat
  service_zone_id:
    type: string
    title: service_zone_id
    description: The shipping option's service zone id.
  shipping_profile_id:
    type: string
    title: shipping_profile_id
    description: The shipping option's shipping profile id.
  provider_id:
    type: string
    title: provider_id
    description: The shipping option's provider id.
  data:
    type: object
    description: The shipping option's data.
  type:
    type: object
    description: The shipping option's type.
    required:
      - id
      - label
      - description
      - code
    properties:
      id:
        type: string
        title: id
        description: The type's ID.
      label:
        type: string
        title: label
        description: The type's label.
      description:
        type: string
        title: description
        description: The type's description.
      code:
        type: string
        title: code
        description: The type's code.
  provider:
    type: object
    description: The shipping option's provider.
    required:
      - id
      - is_enabled
    properties:
      id:
        type: string
        title: id
        description: The provider's ID.
      is_enabled:
        type: boolean
        title: is_enabled
        description: The provider's is enabled.
  amount:
    type: number
    title: amount
    description: The shipping option's amount.
  prices:
    type: array
    description: The shipping option's prices.
    items:
      $ref: ./StorePrice.yaml
  calculated_price:
    $ref: ./StoreCalculatedPrice.yaml
  insufficient_inventory:
    type: boolean
    title: insufficient_inventory
    description: The shipping option's insufficient inventory.
