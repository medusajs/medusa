name: Cloud Docs Automation

on:
  repository_dispatch:
    types:
      - cloud-deployment


jobs:
  # Runs the model with no App token and no write access. Its only output is a
  # patch and PR metadata, which `open-pr` validates before the App token exists.
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}
      base_sha: ${{ steps.base.outputs.sha }}
      changelog_file: ${{ steps.changelog.outputs.file }}
      changelog_display_date: ${{ steps.changelog.outputs.display_date }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: "yarn"

      - name: Install monorepo dependencies
        uses: ./.github/actions/cache-deps
        with:
          extension: cloud-docs-automation

      - name: Install www dependencies
        working-directory: www
        run: yarn install

      - name: Build www packages
        working-directory: www
        run: yarn build:packages

      - name: Install www/utils dependencies
        working-directory: www/utils
        run: yarn install

      - name: Build www/utils packages
        working-directory: www/utils
        run: yarn build

      - name: Write dispatch payload to file
        id: write-payload
        env:
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          node --input-type=module << 'EOF'
            import { writeFileSync } from "fs"
            const payload = JSON.parse(process.env.CLIENT_PAYLOAD)
            writeFileSync("/tmp/cloud-dispatch.json", JSON.stringify(payload, null, 2))
            console.log("Payload written to /tmp/cloud-dispatch.json")
          EOF

      - name: Analyze cloud deployment
        id: analyze
        working-directory: www/utils/packages/docs-automator
        run: yarn analyze-cloud --dispatch-file /tmp/cloud-dispatch.json --output /tmp/analysis.json
        continue-on-error: true

      - name: Check if documentation changes are needed
        id: check
        run: |
          if [ "${{ steps.analyze.outcome }}" = "failure" ]; then
            echo "needs_docs=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node --input-type=module << 'EOF'
          import { readFileSync, appendFileSync } from "fs"
          const a = JSON.parse(readFileSync("/tmp/analysis.json", "utf8"))
          const needed = a.affectedProjects.length > 0 ? "true" : "false"
          appendFileSync(process.env.GITHUB_OUTPUT, `needs_docs=${needed}\n`)
          EOF

      - name: Extract Claude prompt
        id: extract-prompt
        if: steps.check.outputs.needs_docs == 'true'
        run: |
          node --input-type=module << 'EOF'
            import { readFileSync, appendFileSync } from "fs"
            const a = JSON.parse(readFileSync("/tmp/analysis.json", "utf8"))
            const prefix = "IMPORTANT: Only make file changes using the Write and Edit tools. Never use git commands to stage, commit, or push files.\n\nIMPORTANT: To load the writing-docs skill, use the Skill tool directly with skill='writing-docs'. Do NOT spawn a sub-agent or use the Task tool to load it.\n\n"
            const suffix = "\n\n---\n\nIMPORTANT — final step: after applying all documentation changes, write these two files using the Write tool:\n\n1. /tmp/pr-title.txt — a single-line pull request title. It MUST start with \"docs: \", followed by a concise summary of what was changed, and MUST end with \" [automated]\". Keep it under 100 characters. Example: \"docs: document new environment variables page [automated]\"\n2. /tmp/pr-summary.md — a short summary (2-4 sentences, or a few bullet points) of what was updated. Plain markdown, no top-level heading.\n\nIf you made no documentation changes, do not create either file.\n"
            const delimiter = "CLAUDE_PROMPT_EOF"
            appendFileSync(
              process.env.GITHUB_OUTPUT,
              `CLAUDE_PROMPT<<${delimiter}\n${prefix}${a.claudePrompt}${suffix}\n${delimiter}\n`
            )
          EOF

      - name: Read changelog entry metadata
        id: changelog
        if: steps.check.outputs.needs_docs == 'true'
        run: |
          node --input-type=module << 'EOF'
          import { readFileSync, appendFileSync } from "fs"
          const a = JSON.parse(readFileSync("/tmp/analysis.json", "utf8"))
          const entry = a.changelogEntry ?? {}
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `date=${entry.date ?? ""}\ndisplay_date=${entry.displayDate ?? ""}\nfile=${entry.file ?? ""}\n`
          )
          EOF

      - name: Lock down repo automation files
        if: steps.check.outputs.needs_docs == 'true'
        run: chmod -R a-w .github .claude scripts

      - name: Run Claude Code to update cloud docs
        if: steps.check.outputs.needs_docs == 'true'
        uses: anthropics/claude-code-base-action@132be24009ca6f292db66a3d1d5a17249cf68a5d # main, installs Claude Code 2.1.282
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_API_TOKEN }}
          # `_temp` holds the runner's GITHUB_ENV/GITHUB_PATH files, which would let the model set env vars for later steps.
          settings: |
            {
              "permissions": {
                "deny": [
                  "Read(//proc/**)",
                  "Read(//home/runner/work/_temp/**)",
                  "Write(//home/runner/work/_temp/**)",
                  "Edit(//home/runner/work/_temp/**)",
                  "Write(//**/.claude/**)",
                  "Edit(//**/.claude/**)",
                  "Write(//**/.github/**)",
                  "Edit(//**/.github/**)",
                  "Write(//**/.mcp.json)",
                  "Edit(//**/.mcp.json)",
                  "Write(//**/package.json)",
                  "Edit(//**/package.json)"
                ]
              }
            }
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 40
            --allowedTools "Skill,Read,Write,Edit,Glob,Grep,Bash(ls:*)"
          prompt: ${{ steps.extract-prompt.outputs.CLAUDE_PROMPT }}

      - name: Run prep script for cloud project
        if: steps.check.outputs.needs_docs == 'true'
        run: |
          echo "Running prep for cloud..."
          (cd "www/apps/cloud" && yarn prep) || true

      - name: Run lint:content for cloud project
        if: steps.check.outputs.needs_docs == 'true'
        run: |
          echo "Running lint:content for cloud..."
          (cd "www/apps/cloud" && yarn lint:content) || true

      - name: Check for documentation changes
        id: changes
        if: steps.check.outputs.needs_docs == 'true'
        run: |
          # Untracked files are listed too, since new documentation pages and
          # new changelog entry files under `generated/changelog` don't show up
          # in `git diff`.
          PATHS="www/apps/cloud/app www/apps/cloud/generated www/apps/cloud/sidebar.mjs"
          CHANGES=$( { git diff --name-only -- $PATHS; \
            git ls-files --others --exclude-standard -- $PATHS; } \
            | grep -E '\.(mdx|json|mjs)$' || true)
          if [ -n "$CHANGES" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No documentation changes found."
          fi

      - name: Build PR metadata
        id: pr-body
        if: steps.check.outputs.needs_docs == 'true' && steps.changes.outputs.has_changes == 'true'
        run: |
          node --input-type=module << 'EOF'
            import { existsSync, mkdirSync, readFileSync, writeFileSync } from "fs"

            const a = JSON.parse(readFileSync("/tmp/analysis.json", "utf8"))
            const flagged = Array.isArray(a.featureFlaggedFeatures) ? a.featureFlaggedFeatures : []

            // Title generated by Claude, with a fallback if it is missing or malformed
            let title = existsSync("/tmp/pr-title.txt")
              ? readFileSync("/tmp/pr-title.txt", "utf8").split("\n")[0].trim()
              : ""
            if (!title.startsWith("docs: ") || !title.endsWith("[automated]")) {
              title = "docs: update cloud documentation [automated]"
            }

            const summary = existsSync("/tmp/pr-summary.md")
              ? readFileSync("/tmp/pr-summary.md", "utf8").trim()
              : ""

            const lines = [
              "## Automated Cloud Documentation Updates",
              "",
              "This PR contains automated documentation changes triggered by Cloud production deployments.",
              "",
              summary || "_No summary was generated._",
              "",
              "> Review carefully before merging. Claude may have missed context or made incorrect assumptions.",
            ]

            if (flagged.length > 0) {
              lines.push("")
              lines.push("---")
              lines.push("")
              lines.push("### ⚠️ Feature flag warning")
              lines.push("")
              lines.push(
                "The following features appear to be gated by a feature flag. " +
                "**Confirm they have been fully rolled out before merging this PR:**"
              )
              lines.push("")
              for (const f of flagged) {
                lines.push(`- ${f}`)
              }
            }

            mkdirSync("/tmp/cloud-out", { recursive: true })
            writeFileSync("/tmp/cloud-out/pr-title.txt", title)
            writeFileSync("/tmp/cloud-out/pr-body.md", lines.join("\n"))
          EOF

      - name: Package result
        if: steps.check.outputs.needs_docs == 'true' && steps.changes.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          git add -A -- www/apps/cloud/app www/apps/cloud/generated www/apps/cloud/sidebar.mjs
          git diff --cached --binary > /tmp/cloud-out/docs.patch

      - name: Upload result
        if: steps.check.outputs.needs_docs == 'true' && steps.changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloud-docs-${{ github.run_id }}
          path: /tmp/cloud-out/
          if-no-files-found: error
          retention-days: 1

  # Never runs code from the model's job. Validates the patch against fixed
  # paths and limits before the App token exists.
  open-pr:
    needs: generate
    if: needs.generate.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.generate.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cloud-docs-${{ github.run_id }}
          path: /tmp/cloud-out

      - name: Validate and apply patch
        id: validate
        run: |
          set -euo pipefail
          cd /tmp/cloud-out
          if [[ ! -s docs.patch || "$(wc -c < docs.patch)" -gt 5242880 ]]; then
            echo "::error::docs.patch is empty or exceeds 5 MB." >&2
            exit 1
          fi
          if [[ "$(wc -c < pr-body.md)" -gt 30000 ]]; then
            echo "::error::pr-body.md exceeds 30 KB." >&2
            exit 1
          fi
          TITLE=$(cat pr-title.txt)
          if [[ "$TITLE" == *$'\n'* || ${#TITLE} -gt 120 || ! "$TITLE" =~ ^docs:\ [[:print:]]+\ \[automated\]$ ]]; then
            TITLE="docs: update cloud documentation [automated]"
          fi
          DELIMITER="PR_BODY_$(openssl rand -hex 16)"
          {
            echo "title=$TITLE"
            echo "body<<$DELIMITER"
            cat pr-body.md
            echo
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

          cd "$GITHUB_WORKSPACE"
          git apply --index /tmp/cloud-out/docs.patch
          OUTSIDE=$(git diff --cached --no-renames --name-only \
            | grep -vE '^www/apps/cloud/(app|generated)/[^.][^/]*(/[^.][^/]*)*\.(mdx|json|mjs)$|^www/apps/cloud/sidebar\.mjs$' \
            || true)
          if [[ -n "$OUTSIDE" ]]; then
            echo "::error::Patch touches disallowed paths:" >&2
            echo "$OUTSIDE" >&2
            exit 1
          fi

      - name: Setup Node.js
        if: needs.generate.outputs.changelog_file != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: "yarn"
          cache-dependency-path: www/utils/yarn.lock

      - name: Build release-banner
        if: needs.generate.outputs.changelog_file != ''
        working-directory: www/utils
        run: |
          yarn install
          yarn workspace release-banner build

      # Runs after Claude, since the banner is attached to the entry file Claude
      # writes. A missing banner is not worth failing the run over — the entry is
      # the deliverable and the image is decoration — so this only warns.
      - name: Render and upload the changelog banner
        id: banner
        if: needs.generate.outputs.changelog_file != ''
        continue-on-error: true
        env:
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          ENTRY_FILE: ${{ needs.generate.outputs.changelog_file }}
          ENTRY_DATE: ${{ needs.generate.outputs.changelog_display_date }}
        run: |
          if [ ! -f "$ENTRY_FILE" ]; then
            echo "Claude wrote no changelog entry for $ENTRY_DATE — skipping the banner."
            exit 0
          fi

          if [ -z "$CLOUDINARY_URL" ]; then
            echo "::warning::CLOUDINARY_URL is not set — skipping the changelog banner"
            exit 1
          fi

          # Called directly rather than through `yarn upload` so that the only
          # thing captured here is the URL the CLI prints.
          BANNER_URL=$(node www/utils/packages/release-banner/dist/cli.js upload \
            --type cloud-changelog --date "$ENTRY_DATE")

          node www/apps/cloud/scripts/set-changelog-image.mjs \
            --file "$ENTRY_FILE" --url "$BANNER_URL"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.MEDUSA_APP_ID }}
          private-key: ${{ secrets.MEDUSA_APP_PRIVATE_KEY }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@38e0b6e68b4c852a5500a94740f0e535e0d7ba54  # v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore(docs): automated cloud documentation update"
          base: develop
          branch: docs/cloud-docs
          branch-suffix: timestamp
          title: ${{ steps.validate.outputs.title }}
          labels: "type: docs"
          add-paths: |
            www/apps/cloud/app
            www/apps/cloud/generated
            www/apps/cloud/sidebar.mjs
          body: ${{ steps.validate.outputs.body }}
