name: Trigger Release and Publish

on:
  push:
    branches:
      - develop
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        type: choice
        default: "preview"
        description: What tag do you want to release?
        required: true
        options:
          - preview
          - next
          - snapshot
          - canary
          - latest
      branch:
        type: string
        default: "develop"
        description: Which branch or commit SHA do you want to release from?
        required: true
    branches:
      - develop
    paths-ignore:
      - "docs/**"
      - "www/**"
      - ".github/**"
  issue_comment:
    types:
      - created

concurrency: ${{ github.workflow }}-${{ github.event_name == 'issue_comment' && github.event.comment.id || (github.event_name == 'push' || github.event.inputs.version == 'latest') && format('latest-{0}', github.ref) || github.ref }}

permissions:
  pull-requests: write # to be able to comment on released pull requests
  id-token: write # to enable use of OIDC for trusted publishing and npm provenance

jobs:
  check:
    name: Check if latest release is running
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.version != 'latest')
    runs-on: ubuntu-latest
    outputs:
      release_running: ${{ steps.check_release.outputs.release_running }}
    steps:
      - name: Check for active latest release runs
        id: check_release
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'trigger-release.yml',
              event: 'push',
              per_page: 10,
            })
            const isRunning = data.workflow_runs.some(
              run => ['in_progress', 'queued', 'waiting', 'requested', 'pending'].includes(run.status)
            )
            if (isRunning) {
              core.notice('Latest release is currently running. Skipping preview release to avoid conflicts.')
            }
            core.setOutput('release_running', isRunning.toString())

  release:
    name: Trigger ${{ github.event.inputs.version || 'preview' }} Release
    needs: check
    if: needs.check.outputs.release_running != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.branch || 'develop' }}

      - name: Setup release env
        uses: ./.github/actions/setup-release

      - name: Version packages
        run: yarn changeset version --snapshot ${{ github.event.inputs.version || 'preview' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Dependencies
        run: yarn install --no-immutable

      - name: Build all packages
        run: yarn build

      - name: Publish packages under next tag
        run: yarn changeset publish --no-git-tags --snapshot --tag ${{ github.event.inputs.version || 'preview' }}

      - name: Post failure to Slack channel
        if: failure()
        id: slack
        uses: slackapi/slack-github-action@v1.23.0
        with:
          channel-id: "releases"
          payload: |
            {
              "blocks":[
                {
                  "type": "header",
                  "text":  {
                    "type": "plain_text",
                    "text": "Failed to release! ⛔"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "plain_text",
                    "text": "Triggering a release for ${{ github.event.inputs.version || 'preview' }} environments failed for ${{ github.run_id }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_RELEASE }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  latest:
    name: Version packages PR
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.version == 'latest')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: write # required to createWorkflowDispatch the draft-release workflow
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.branch || github.sha }}

      - name: Setup release env
        uses: ./.github/actions/setup-release

      - name: Build packages
        run: yarn build

      - name: Create Release Pull Request or Publish packages
        id: changesets
        uses: changesets/action@v1
        with:
          version: yarn version
          commit: "Chore: Release"
          title: "Chore: Release"
          createGithubReleases: false
          publish: yarn changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger draft release generation
        if: steps.changesets.outputs.published == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const packages = JSON.parse('${{ steps.changesets.outputs.publishedPackages }}')
            const version = packages[0]?.version ?? ''
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'draft-release.yml',
              ref: 'develop',
              inputs: {
                version
              }
            })

  snapshot:
    name: Dispatch Snapshot Release
    if: |
      github.event.issue.pull_request &&
      github.event.comment.body == '/snapshot-this'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: write
    steps:
      - name: Validate pull request and dispatch snapshot release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              ...context.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            })

            const fail = async (message) => {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body: message,
              })
              core.setFailed(message)
            }

            const actorPermission = (await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo,
              username: context.actor,
            })).data.permission
            if (!['write', 'admin'].includes(actorPermission)) {
              return fail('Only users with write permission to the respository can run /snapshot-this')
            }

            const { data: pullRequest } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.issue.number,
            })
            if (context.payload.repository.full_name !== pullRequest.head.repo.full_name) {
              return fail('`/snapshot-this` is not supported on pull requests from forked repositories.')
            }

            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'trigger-release.yml',
              ref: context.payload.repository.default_branch,
              inputs: {
                version: 'snapshot',
                branch: pullRequest.head.ref,
              },
            })

            const runsUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/workflows/trigger-release.yml?query=event%3Aworkflow_dispatch`
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `#### :rocket: A snapshot release was triggered for \`${pullRequest.head.ref}\`\n\nFollow its progress [here](${runsUrl}). Once it finishes, install the snapshot with the \`snapshot\` tag, for example:\n\n\`\`\`sh\nyarn add @medusajs/medusa@snapshot\n\`\`\``,
            })
