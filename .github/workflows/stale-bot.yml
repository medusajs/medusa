name: "Close stale issues and PRs"
on:
  schedule:
    - cron: "30 1 * * *"

permissions:
  actions: write
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9
        with:
          stale-issue-message: "This issue is stale because it has been waiting on more information for 15 days. Comment with the requested details or this will be closed in 3 days."
          stale-pr-message: "This PR is stale because it has been open 15 days with no activity. Remove stale label or comment or this will be closed in 5 days."
          close-issue-message: "This issue was closed because the requested information wasn't provided. Comment with the details so a maintainer can reopen it."
          close-pr-message: "This PR was closed because it has been stalled for 5 days with no activity."
          only-issue-labels: "requires-more"
          exempt-pr-labels: "team: medusa"
          days-before-issue-stale: 15
          days-before-pr-stale: 15
          days-before-issue-close: 3
          days-before-pr-close: 5
          operations-per-run: 500
