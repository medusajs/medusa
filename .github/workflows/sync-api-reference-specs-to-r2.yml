name: Sync API Reference Specs to R2

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA to retrieve changed files from (defaults to HEAD)"
        required: false
        type: string
  push:
    branches:
      - develop
    paths:
      - "www/apps/api-reference/specs/**"

jobs:
  sync:
    name: Sync changed spec files to R2
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www/apps/api-reference

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.commit_sha != '' && '0' || '2' }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable
        working-directory: .

      - name: Resolve dispatch base SHA
        if: inputs.commit_sha != ''
        id: dispatch_base
        working-directory: .
        run: echo "base_sha=$(git rev-parse ${{ inputs.commit_sha }}^)" >> "$GITHUB_OUTPUT"

      - name: Get changed spec files
        id: changed
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96
        with:
          files: "www/apps/api-reference/specs/**"
          separator: " "
          sha: ${{ inputs.commit_sha || '' }}
          base_sha: ${{ steps.dispatch_base.outputs.base_sha || '' }}

      - name: Upload added/modified specs
        if: steps.changed.outputs.any_changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.all_changed_files }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_API_REFERENCE_BUCKET_NAME }}
        run: |
          STRIPPED=$(echo "$CHANGED_FILES" | tr ' ' '\n' | sed 's|^www/apps/api-reference/||' | tr '\n' ' ')
          node ./scripts/upload-specs-to-r2.mjs --upload $STRIPPED

      - name: Remove deleted specs
        if: steps.changed.outputs.any_deleted == 'true'
        env:
          DELETED_FILES: ${{ steps.changed.outputs.deleted_files }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_API_REFERENCE_BUCKET_NAME }}
        run: |
          STRIPPED=$(echo "$DELETED_FILES" | tr ' ' '\n' | sed 's|^www/apps/api-reference/||' | tr '\n' ' ')
          node ./scripts/upload-specs-to-r2.mjs --remove $STRIPPED

      # The `secrets` context isn't available in a step's `if`, so the check is
      # done here and exposed as an output.
      - name: Check whether the resync webhook is configured
        id: webhook
        if: steps.changed.outputs.any_changed == 'true' || steps.changed.outputs.any_deleted == 'true'
        env:
          MEDUSA_CLOUD_API_URL: ${{ secrets.MEDUSA_CLOUD_API_URL }}
          MEDUSA_CLOUD_API_KEY: ${{ secrets.MEDUSA_CLOUD_API_KEY }}
        run: |
          if [ -n "$MEDUSA_CLOUD_API_URL" ] && [ -n "$MEDUSA_CLOUD_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping the resync trigger: MEDUSA_CLOUD_API_URL and/or MEDUSA_CLOUD_API_KEY aren't set."
          fi

      - name: Trigger specs resync
        if: steps.webhook.outputs.configured == 'true'
        env:
          MEDUSA_CLOUD_API_URL: ${{ secrets.MEDUSA_CLOUD_API_URL }}
          MEDUSA_CLOUD_API_KEY: ${{ secrets.MEDUSA_CLOUD_API_KEY }}
          COMMIT_SHA: ${{ inputs.commit_sha || github.sha }}
        run: |
          # the secret may hold a bare host, so the scheme is added when missing
          BASE_URL="$MEDUSA_CLOUD_API_URL"
          case "$BASE_URL" in
            http://*|https://*) ;;
            *) BASE_URL="https://$BASE_URL" ;;
          esac
          BASE_URL="${BASE_URL%/}"

          curl --fail-with-body --silent --show-error --location \
            --request POST "$BASE_URL/hooks/oas-specs" \
            --header "Authorization: Basic $MEDUSA_CLOUD_API_KEY" \
            --header "Content-Type: application/json" \
            --data "{\"commit_sha\": \"$COMMIT_SHA\"}"
