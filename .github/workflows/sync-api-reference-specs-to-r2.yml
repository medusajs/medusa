name: Sync API Reference Specs to R2

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA to retrieve changed files from (defaults to HEAD)"
        required: false
        type: string
  push:
    branches:
      - develop
    paths:
      - "www/apps/api-reference/specs/**"

jobs:
  sync:
    name: Sync changed spec files to R2
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www/apps/api-reference

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.commit_sha != '' && '0' || '2' }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: true
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable
        working-directory: .

      - name: Resolve dispatch base SHA
        if: inputs.commit_sha != ''
        id: dispatch_base
        working-directory: .
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          if ! [[ "$COMMIT_SHA" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::commit_sha must be a hex commit SHA" >&2
            exit 1
          fi
          echo "base_sha=$(git rev-parse "${COMMIT_SHA}^")" >> "$GITHUB_OUTPUT"

      - name: Get changed spec files
        id: changed
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96
        with:
          files: "www/apps/api-reference/specs/**"
          separator: " "
          sha: ${{ inputs.commit_sha || '' }}
          base_sha: ${{ steps.dispatch_base.outputs.base_sha || '' }}

      - name: Upload added/modified specs
        if: steps.changed.outputs.any_changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.all_changed_files }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_API_REFERENCE_BUCKET_NAME }}
        run: |
          STRIPPED=$(echo "$CHANGED_FILES" | tr ' ' '\n' | sed 's|^www/apps/api-reference/||' | tr '\n' ' ')
          node ./scripts/upload-specs-to-r2.mjs --upload $STRIPPED

      - name: Remove deleted specs
        if: steps.changed.outputs.any_deleted == 'true'
        env:
          DELETED_FILES: ${{ steps.changed.outputs.deleted_files }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_API_REFERENCE_BUCKET_NAME }}
        run: |
          STRIPPED=$(echo "$DELETED_FILES" | tr ' ' '\n' | sed 's|^www/apps/api-reference/||' | tr '\n' ' ')
          node ./scripts/upload-specs-to-r2.mjs --remove $STRIPPED

      - name: Generate GitHub App token
        id: app-token
        if: steps.changed.outputs.any_changed == 'true'
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.MEDUSA_APP_ID }}
          private-key: ${{ secrets.MEDUSA_APP_PRIVATE_KEY }}
          owner: medusajs
          repositories: platform
          permission-contents: write

      - name: Sync to cloud
        if: steps.changed.outputs.any_changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          VERSION="$(sed -nE 's/^  version: ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' specs/admin/openapi.full.yaml | head -1)"
          if [ -z "$VERSION" ]; then
            echo "::error::No version found in specs/admin/openapi.full.yaml"
            exit 1
          fi

          gh api repos/medusajs/platform/dispatches \
            -f event_type=medusa-specs-uploaded \
            -f "client_payload[version]=$VERSION"
