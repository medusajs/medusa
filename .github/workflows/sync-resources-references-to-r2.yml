name: Sync Resources References to R2

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA to retrieve changed files from (defaults to HEAD)"
        required: false
        type: string
  push:
    branches:
      - develop
    paths:
      - "www/apps/resources/references/**"

jobs:
  sync:
    name: Sync changed reference files to R2
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www/apps/resources

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.commit_sha != '' && '0' || '2' }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable
        working-directory: .

      - name: Resolve dispatch base SHA
        if: inputs.commit_sha != ''
        id: dispatch_base
        working-directory: .
        run: echo "base_sha=$(git rev-parse ${{ inputs.commit_sha }}^)" >> "$GITHUB_OUTPUT"

      - name: Get changed reference files
        id: changed
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96
        with:
          files: "www/apps/resources/references/**"
          separator: " "
          # Write the file lists to disk (.github/outputs/*.txt) instead of only
          # step outputs. A large batch of changes makes all_changed_files too big
          # to pass through a step env var: GitHub injects env values into the
          # process environment, and once the string exceeds the kernel's argv+env
          # limit, bash itself fails to start with "Argument list too long".
          write_output_files: true
          sha: ${{ inputs.commit_sha || '' }}
          base_sha: ${{ steps.dispatch_base.outputs.base_sha || '' }}

      - name: Upload added/modified references
        if: steps.changed.outputs.any_changed == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_RESOURCES_BUCKET_NAME }}
        run: |
          FILE="$GITHUB_WORKSPACE/.github/outputs/all_changed_files.txt"
          COUNT=$(tr ' ' '\n' < "$FILE" | grep -c '/page\.json$' || true)
          if [ "$COUNT" -eq 0 ]; then
            echo "No reference files to upload."
            exit 0
          fi
          # xargs batches the paths so node is exec'd in bounded chunks, never a
          # single argv large enough to overflow the argument list limit.
          tr ' ' '\n' < "$FILE" | grep '/page\.json$' | sed 's|^www/apps/resources/||' \
            | xargs -r -d '\n' -n 500 node ./scripts/upload-references-to-r2.mjs --upload

      - name: Remove deleted references
        if: steps.changed.outputs.any_deleted == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_RESOURCES_BUCKET_NAME }}
        run: |
          FILE="$GITHUB_WORKSPACE/.github/outputs/deleted_files.txt"
          COUNT=$(tr ' ' '\n' < "$FILE" | grep -c '/page\.json$' || true)
          if [ "$COUNT" -eq 0 ]; then
            echo "No reference files to remove."
            exit 0
          fi
          tr ' ' '\n' < "$FILE" | grep '/page\.json$' | sed 's|^www/apps/resources/||' \
            | xargs -r -d '\n' -n 500 node ./scripts/upload-references-to-r2.mjs --remove
