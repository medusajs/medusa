name: PR Review

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

jobs:
  review:
    # Skip draft PRs and PRs from bots
    if: github.event.pull_request.draft == false && github.event.pull_request.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check if author is a team member
        id: check-team
        run: |
          AUTHOR="${{ github.event.pull_request.user.login }}"
          if grep -qF "\"@${AUTHOR}\"" .github/teams.yml; then
            echo "is_team_member=true" >> $GITHUB_OUTPUT
          else
            echo "is_team_member=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate GitHub App token
        if: steps.check-team.outputs.is_team_member == 'false'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.MEDUSA_APP_ID }}
          private-key: ${{ secrets.MEDUSA_APP_PRIVATE_KEY }}

      - name: Review PR
        if: steps.check-team.outputs.is_team_member == 'false'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: develop
          show_full_output: true
          plugin_marketplaces: "https://github.com/medusajs/medusa-agent-skills.git"
          plugins: "medusa-dev@medusa"

          prompt: |
            PR NUMBER: ${{ github.event.pull_request.number }}
            PR TITLE: ${{ github.event.pull_request.title }}
            PR AUTHOR: ${{ github.event.pull_request.user.login }}

            Note: all scripts are located in the root `scripts/` directory and should be run as `bash scripts/<script>.sh`.

            /reviewing-prs ${{ github.event.pull_request.number }} "${{ github.event.pull_request.title }}" "${{ github.event.pull_request.user.login }}"

          claude_args: >-
            --allowedTools
            "Bash(bash scripts/get_pr.sh:*),
            Bash(bash scripts/get_pr_files.sh:*),
            Bash(bash scripts/get_linked_issues.sh:*),
            Bash(bash scripts/get_comments.sh:*),
            Bash(bash scripts/add_comment.sh:*),
            Bash(bash scripts/labels.sh:*),
            Bash(bash scripts/get_labels.sh:*),
            Bash(bash scripts/get_issue.sh:*),
            Bash(bash scripts/close_issue.sh:*),
            Read"
