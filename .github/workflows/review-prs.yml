name: PR Review

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  issue_comment:
    types: [created]
  workflow_dispatch: {}

jobs:
  # Runs only on workflow_dispatch: collects all open non-draft PRs for the matrix below
  get-open-prs:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      matrix: ${{ steps.get-prs.outputs.matrix }}
    steps:
      - name: Get open non-draft PRs
        id: get-prs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          matrix=$(gh pr list --repo ${{ github.repository }} --state open --json number,isDraft \
            --jq '[.[] | select(.isDraft == false) | {number: .number}]')
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  # Runs on workflow_dispatch: reviews every open non-draft PR (team members included)
  review-all:
    needs: get-open-prs
    if: needs.get-open-prs.outputs.matrix != '[]' && needs.get-open-prs.outputs.matrix != ''
    strategy:
      matrix:
        pr: ${{ fromJson(needs.get-open-prs.outputs.matrix) }}
      max-parallel: 5
      fail-fast: false
    uses: ./.github/workflows/review-pr-action.yml
    with:
      pr_number: '${{ matrix.pr.number }}'
    secrets:
      MEDUSA_APP_ID: ${{ secrets.MEDUSA_APP_ID }}
      MEDUSA_APP_PRIVATE_KEY: ${{ secrets.MEDUSA_APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # Runs on pull_request and issue_comment (@medusaBot review) events: determines PR number
  prepare:
    if: |
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.user.login != 'github-actions[bot]') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request.url != '' &&
       contains(github.event.comment.body, '@medusaBot review'))
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.set.outputs.pr_number }}
    steps:
      - name: Set PR number
        id: set
        run: |
          if [ "${{ github.event_name }}" == "issue_comment" ]; then
            echo "pr_number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          else
            echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          fi

  # Runs on pull_request and issue_comment: calls the reusable review workflow
  review:
    needs: prepare
    uses: ./.github/workflows/review-pr-action.yml
    with:
      pr_number: ${{ needs.prepare.outputs.pr_number }}
    secrets:
      MEDUSA_APP_ID: ${{ secrets.MEDUSA_APP_ID }}
      MEDUSA_APP_PRIVATE_KEY: ${{ secrets.MEDUSA_APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
