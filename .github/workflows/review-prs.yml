name: PR Review

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

jobs:
  review:
    # Skip draft PRs
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Review PR
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_API_TOKEN }}
          base_branch: develop
          show_full_output: true
          plugin_marketplaces: "https://github.com/medusajs/medusa-agent-skills.git"
          plugins: "medusa-dev@medusa"

          prompt: |
            PR NUMBER: ${{ github.event.pull_request.number }}
            PR TITLE: ${{ github.event.pull_request.title }}
            PR AUTHOR: ${{ github.event.pull_request.user.login }}

            Note: all scripts are located in the root `scripts/` directory and should be run as `bash scripts/<script>.sh`.

            /reviewing-prs ${{ github.event.pull_request.number }} "${{ github.event.pull_request.title }}" "${{ github.event.pull_request.user.login }}"

          claude_args: >-
            --allowedTools
            "Bash(bash scripts/get_pr.sh:*),
            Bash(bash scripts/get_pr_files.sh:*),
            Bash(bash scripts/get_linked_issues.sh:*),
            Bash(bash scripts/get_comments.sh:*),
            Bash(bash scripts/add_comment.sh:*),
            Bash(bash scripts/labels.sh:*),
            Bash(bash scripts/get_labels.sh:*),
            Bash(bash scripts/get_issue.sh:*),
            Bash(bash scripts/close_issue.sh:*),
            Read"
